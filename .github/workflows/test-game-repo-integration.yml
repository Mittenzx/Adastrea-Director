name: Test Game Repository Integration

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      run_integration:
        description: 'Run integration tests (requires secrets)'
        required: false
        default: 'true'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          
      - name: Run unit tests
        run: |
          pytest tests/test_game_repo_ingestion.py -v -s -m unit --tb=short
          
      - name: Display test summary
        if: always()
        run: |
          echo "✅ Unit tests completed"
          echo "These tests use mock data and don't require credentials"

  integration-tests:
    name: Integration Tests (with real repository)
    runs-on: ubuntu-latest
    # Only run on main branch or when manually triggered with run_integration=true
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_integration == 'true')
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          
      - name: Check for secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.GAME_REPO_TOKEN }}" ] && [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "secrets_available=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets are configured"
          else
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "⚠️  Secrets not configured - skipping integration tests"
            echo "See docs/guides/SETUP_GITHUB_SECRETS.md for setup instructions"
          fi
          
      - name: Run integration tests
        if: steps.check_secrets.outputs.secrets_available == 'true'
        run: |
          pytest tests/test_game_repo_ingestion.py -v -s -m integration --tb=short
        env:
          GITHUB_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
      - name: Display test summary
        if: always() && steps.check_secrets.outputs.secrets_available == 'true'
        run: |
          echo "✅ Integration tests completed"
          echo "These tests validate ingestion from the Mittenzx/Adastrea repository"
          echo "Tests may skip if repository is inaccessible or API rate limits are hit"
          
      - name: Skip message
        if: steps.check_secrets.outputs.secrets_available == 'false'
        run: |
          echo "⚠️  Integration tests skipped - secrets not configured"
          echo ""
          echo "To enable integration testing:"
          echo "1. Follow instructions in docs/guides/SETUP_GITHUB_SECRETS.md"
          echo "2. Add GAME_REPO_TOKEN and OPENAI_API_KEY secrets"
          echo "3. Re-run this workflow"

  test-script:
    name: Test Script Functionality
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          
      - name: Test script help
        run: |
          python ingest_game_repo.py --help
          
      - name: Test script stats (no prior data)
        run: |
          python ingest_game_repo.py --stats
          
      - name: Display summary
        run: |
          echo "✅ Script functionality verified"
          echo "- Help text displays correctly"
          echo "- Stats command works without data"
